<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Dashboard - Cartão Mestre</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- Reaproveita o runtime Tailwind já usado no template em design-system/ -->
    <script src="../design-system/assets/resource_3fa48481346f.js"></script>
    <!-- Plus Jakarta Sans já vinha empacotada localmente em design-system/assets/
     (sobrando da exportação do template) — self-hosted, sem depender de rede. -->
    <link
      rel="stylesheet"
      href="../design-system/assets/css2_0b2072b66163.css"
    />
    <style>
      body {
        font-family:
          "Plus Jakarta Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-variant-numeric: tabular-nums; /* números do mesmo tamanho alinham nas colunas dos KPIs/tabelas */
      }
    </style>
    <style>
      /* -------------------------------------------------- vidro (glassmorphism) */
      :root {
        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-bg-strong: rgba(255, 255, 255, 0.09);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: 0 8px 32px -12px rgba(0, 0, 0, 0.6);
        /* Faz o navegador renderizar controles nativos (o popup do <select>,
       scrollbars, etc.) na variante escura em vez do branco padrão do SO —
       sem isso eles destoam de todo o resto do vidro escuro. */
        color-scheme: dark;
      }

      /* -------------------------------------------------- scrollbars no tema */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      *::-webkit-scrollbar-corner {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.16);
        border-radius: 9999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      *::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.28);
        background-clip: padding-box;
      }

      /* Sem backdrop-filter aqui de propósito: é a propriedade CSS mais cara pra
     GPU, e esses painéis ficam abertos o tempo todo (não são um modal
     passageiro). Com dezenas deles na tela + a aurora animada por trás, cada
     frame obrigava o navegador a reamostrar tudo — muito peso pra placa de
     vídeo. O visual de "vidro" fica só por conta de fundo translúcido +
     borda clara + sombra com realce interno, que é praticamente idêntico
     a olho nu sobre um fundo já suave feito a aurora, e custa quase nada. */
      .cm-glass {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      }

      .cm-glass-danger {
        background: rgba(127, 29, 29, 0.28);
        border: 1px solid rgba(248, 113, 113, 0.25);
        box-shadow:
          0 8px 32px -12px rgba(220, 38, 38, 0.35),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
      }

      .cm-glass-warn {
        background: rgba(120, 53, 15, 0.24);
        border: 1px solid rgba(251, 191, 36, 0.22);
        box-shadow:
          0 8px 32px -12px rgba(217, 119, 6, 0.3),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
      }

      /* Contraste reforçado (bg/borda mais fortes que --glass-bg-strong/--glass-border
     puros) — os controles da barra de filtros (Período/Setor/Motivo/Gestor, o botão
     de busca, o toggle de órfãs) ficavam quase invisíveis contra o fundo quase preto
     fora das manchas da aurora: com só 9%/10% de branco, borda e fundo praticamente
     somem no header, onde a aurora é mais fraca. Sombra + realce interno dão a mesma
     "borda" que os cards (.cm-glass) já têm, só que autossuficiente aqui, já que o
     glass-shadow padrão sozinho não bastava sem o preenchimento mais opaco. */
      .cm-select {
        background: rgba(255, 255, 255, 0.14) !important;
        border: 1px solid rgba(255, 255, 255, 0.24) !important;
        box-shadow:
          0 4px 14px -8px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
      }
      .cm-select:hover {
        background: rgba(255, 255, 255, 0.19) !important;
      }

      /* Vidro mais opaco, só pros dois modais passageiros (ficha do colaborador,
     paleta Ctrl K). Eles flutuam sobre o scrim bg-black/60 + aurora borrada
     atrás; com o --glass-bg padrão (6% branco) o cartão quase some contra
     esse fundo escuro ("busca quase invisível"). Não pesa em performance
     porque só existe enquanto o modal está aberto, não fica montado sempre. */
      .cm-glass-modal {
        background: rgba(24, 24, 27, 0.94);
        border: 1px solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      }

      /* -------------------------------------------------- fundo ambiente (aurora) */
      .cm-aurora {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .cm-aurora__blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(90px);
        opacity: 0.28;
        will-change: transform;
      }
      .cm-aurora__blob--1 {
        width: 42rem;
        height: 42rem;
        top: -14rem;
        left: -10rem;
        background: radial-gradient(
          circle at 30% 30%,
          #2563eb,
          transparent 70%
        );
        animation: cm-drift-1 34s ease-in-out infinite;
      }
      .cm-aurora__blob--2 {
        width: 38rem;
        height: 38rem;
        top: 8rem;
        right: -12rem;
        background: radial-gradient(
          circle at 70% 40%,
          #db2777,
          transparent 70%
        );
        animation: cm-drift-2 40s ease-in-out infinite;
      }
      .cm-aurora__blob--3 {
        width: 34rem;
        height: 34rem;
        bottom: -16rem;
        left: 22rem;
        background: radial-gradient(
          circle at 50% 50%,
          #059669,
          transparent 70%
        );
        animation: cm-drift-3 46s ease-in-out infinite;
      }
      @keyframes cm-drift-1 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(4rem, 3rem) scale(1.08);
        }
      }
      @keyframes cm-drift-2 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(-3rem, 4rem) scale(1.05);
        }
      }
      @keyframes cm-drift-3 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(3rem, -3rem) scale(1.1);
        }
      }

      /* -------------------------------------------------- chips de filtro entrando */
      @keyframes cm-chip-in {
        from {
          opacity: 0;
          transform: translateY(-4px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .cm-chip-in {
        animation: cm-chip-in 260ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @media (prefers-reduced-motion: reduce) {
        .cm-aurora__blob {
          animation: none;
        }
        .cm-chip-in {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-neutral-950 text-white antialiased">
    <div class="cm-aurora" aria-hidden="true">
      <div class="cm-aurora__blob cm-aurora__blob--1"></div>
      <div class="cm-aurora__blob cm-aurora__blob--2"></div>
      <div class="cm-aurora__blob cm-aurora__blob--3"></div>
    </div>

    <div
      id="error-banner"
      class="hidden relative z-10 mx-4 mt-4 rounded-2xl bg-red-950/60 border border-red-800 text-red-200 text-sm p-4"
    ></div>

    <div class="min-h-screen flex flex-col relative z-10">
      <header class="border-b border-white/10">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-5">
          <!-- Título + selo de contagem numa linha só. O selo de contagem
           empurrado pra direita com ml-auto, sem competir por largura com a
           barra de filtros abaixo (que agora tem a linha inteira pra si —
           era a causa do toggle de matrículas órfãs "quebrando" pra uma
           linha sozinho: a barra de filtros dividia espaço com este bloco
           de título, e o texto longo do selo empurrava o resto pra fora). -->
          <div class="flex flex-wrap items-center gap-3">
            <div
              class="shrink-0 w-10 h-10 sm:w-11 sm:h-11 rounded-2xl cm-glass flex items-center justify-center text-lg shadow-[0_0_0_1px_rgba(96,165,250,0.15),0_10px_30px_-12px_rgba(96,165,250,0.4)]"
            >
              💳
            </div>
            <h1
              class="text-xl sm:text-2xl font-bold tracking-tight text-white"
              style="font-size: 2rem"
            >
              Cartão Mestre
              <span class="text-white/35 font-medium" style="margin-left: 15px">
                Dashboard · Elton Marques</span
              >
            </h1>
            <p
              id="header-subtitle"
              class="cm-select ml-auto shrink-0 rounded-full px-3 py-1.5 text-xs text-white/60"
            >
              Carregando dados…
            </p>
          </div>

          <div class="flex flex-wrap items-center gap-2 mt-4">
            <button
              id="open-palette"
              type="button"
              class="cm-select flex items-center gap-2 rounded-full text-sm px-3 py-2 text-white/60 transition-colors duration-150 hover:border-white/25 hover:text-white/90"
            >
              <span>🔍 Buscar</span>
              <span
                class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-white/50"
                >Ctrl K</span
              >
            </button>
            <!-- Dropdowns 100% renderizados via JS (render.js: renderFilterDropdown) —
             o <select> nativo some substituído porque o popup dele é desenhado
             pelo SO (fora do alcance do CSS), então destoava do resto do vidro
             escuro mesmo com color-scheme:dark. -->
            <div id="filter-mes" class="relative"></div>
            <div id="filter-setor" class="relative"></div>
            <div id="filter-motivo" class="relative"></div>
            <div id="filter-aprovador" class="relative"></div>
            <!-- "Mais opções" (render.js: renderMoreOptions) — hoje só guarda o toggle
             de matrículas órfãs; um popover atrás de um botão compacto em vez de
             um switch com texto longo sempre visível na barra. -->
            <div id="filter-more" class="relative"></div>
          </div>
        </div>
      </header>

      <!-- Fixa no topo ao rolar (sticky), com fundo quase opaco (sem
       backdrop-filter — fica montada o tempo todo que há filtro ativo,
       então blur custaria caro; um fundo sólido já resolve a legibilidade)
       pra sempre dar pra ver que o dashboard está filtrado, mesmo lá embaixo. -->
      <div
        id="active-filters"
        class="hidden sticky top-0 z-30 flex flex-wrap gap-2 items-center px-4 sm:px-6 lg:px-8 py-3 bg-neutral-950/95 border-b border-white/10"
      ></div>

      <main class="flex-1">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 space-y-6">
          <!-- Resumo -->
          <section
            id="kpi-grid"
            class="cm-card grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4"
          ></section>

          <!-- Padrões -->
          <section class="grid grid-cols-1 lg:grid-cols-[7fr_3fr] gap-4">
            <div
              id="heatmap-card"
              class="cm-card cm-glass rounded-3xl p-5 sm:p-6"
            ></div>
            <div
              id="motivo-card"
              class="cm-card cm-glass rounded-3xl p-5 sm:p-6"
            ></div>
          </section>

          <!-- Granularidade que faltava entre "mês" e "dia da semana": um pico
           num dia específico do calendário. -->
          <section
            id="dia-card"
            class="cm-card cm-glass rounded-3xl p-5 sm:p-6"
          ></section>

          <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div
              id="setor-card"
              class="cm-card cm-glass rounded-3xl p-5 sm:p-6"
            ></div>
            <div
              id="colaboradores-card"
              class="cm-card cm-glass rounded-3xl p-5 sm:p-6"
            ></div>
          </section>

          <!-- Pessoas / Anomalias -->
          <section
            id="anomalias-card"
            class="cm-card rounded-3xl p-5 sm:p-6"
          ></section>

          <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div
              id="aprovadores-card"
              class="cm-card cm-glass rounded-3xl p-5 sm:p-6"
            ></div>
            <div id="alerta-card" class="cm-card rounded-3xl p-5 sm:p-6"></div>
          </section>
        </div>
      </main>
    </div>

    <div id="colaborador-modal-root"></div>
    <div id="command-palette-root"></div>
    <div id="trend-modal-root"></div>
    <!-- Liberação: lista filtrada (drill-down) e detalhe individual — abrem por cima
     de tudo o resto sem alterar o estado de filtros do dashboard por trás. -->
    <div id="liberacoes-modal-root"></div>
    <div id="detalhe-modal-root"></div>

    <script src="js/csv.js"></script>
    <script src="js/normalize.js"></script>
    <script src="js/data.js"></script>
    <script src="js/aggregate.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
