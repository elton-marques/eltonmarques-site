server {
    listen 127.0.0.1:8080;
    server_name eltonmarques.com;
    root /var/www/cartao-mestre;

    # Sem isso, os `return 30x` abaixo montam a Location como
    # http://eltonmarques.com:8080/... (o scheme/porta que o nginx enxerga
    # localmente atrás do túnel) em vez de https://eltonmarques.com/... (o
    # que o navegador realmente vê). Com absolute_redirect off, o nginx
    # manda só o path (ex.: "/login/?next=..."), e o navegador resolve
    # contra a URL atual — que já está certa, porque é o Cloudflare quem
    # termina o HTTPS.
    absolute_redirect off;

    location = /cartaomestre {
        return 301 /cartaomestre/;
    }

    location /cartaomestre/ {
        auth_request /internal-verify;
        error_page 401 = @login_redirect;
        alias /var/www/cartao-mestre/app/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Assets do template (fontes/CSS/JS) — sem dado sensível, fica público
    # para que o hub e a tela de login também consigam carregar.
    location /design-system/ {
        alias /var/www/cartao-mestre/design-system/;
    }

    location /dados/ {
        auth_request /internal-verify;
        error_page 401 = @login_redirect;
        alias /var/www/cartao-mestre/dados/;
    }

    # Sub-requisição interna do nginx (não é o navegador batendo aqui) que
    # consulta o serviço de sessão em 127.0.0.1:8082. Sem corpo, só cookie.
    location = /internal-verify {
        internal;
        proxy_pass http://127.0.0.1:8082/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_redirect {
        return 302 /login/?next=$request_uri;
    }

    location /login/ {
        alias /var/www/login/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Login/logout chamados pelo navegador via fetch() a partir de /login/.
    location /auth/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
    }

    location / {
        return 404;
    }
}
