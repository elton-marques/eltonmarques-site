server {
    listen 127.0.0.1:8081;
    server_name eltonmarques.com;
    root /var/www/hub;

    # headers de segurança — "always" pra sair também na resposta 404,
    # não só em 200. HSTS sem includeSubDomains/preload de propósito: não
    # dá pra garantir que todo subdomínio futuro já serve HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }
}
