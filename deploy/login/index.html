<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Entrar — Cartão Mestre</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="icon" href="../design-system/assets/icons/favicon-cartao-mestre.svg" type="image/svg+xml" />
    <script src="../design-system/assets/resource_3fa48481346f.js"></script>
    <link rel="stylesheet" href="../design-system/assets/css2_0b2072b66163.css" />
    <style>
      body {
        font-family:
          "Plus Jakarta Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      :root {
        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: 0 8px 32px -12px rgba(0, 0, 0, 0.6);
        color-scheme: dark;
      }

      .cm-glass {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      }

      .cm-glass-modal {
        background: rgba(24, 24, 27, 0.94);
        border: 1px solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      }

      .cm-input {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        transition: border-color 150ms ease, background 150ms ease;
      }
      .cm-input:focus {
        outline: none;
        border-color: rgba(96, 165, 250, 0.55);
        background: rgba(255, 255, 255, 0.09);
      }
      .cm-input-icon {
        pointer-events: none;
        color: rgba(255, 255, 255, 0.3);
      }
      .cm-input-wrap:focus-within .cm-input-icon {
        color: rgba(96, 165, 250, 0.75);
      }
      .cm-toggle-pw {
        color: rgba(255, 255, 255, 0.35);
        transition: color 150ms ease;
      }
      .cm-toggle-pw:hover {
        color: rgba(255, 255, 255, 0.65);
      }

      /* -------------------------------------------------- fundo ambiente (aurora) */
      .cm-aurora {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .cm-aurora__blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(90px);
        opacity: 0.28;
        will-change: transform;
      }
      .cm-aurora__blob--1 {
        width: 42rem;
        height: 42rem;
        top: -14rem;
        left: -10rem;
        background: radial-gradient(circle at 30% 30%, #2563eb, transparent 70%);
        animation: cm-drift-1 34s ease-in-out infinite;
      }
      .cm-aurora__blob--2 {
        width: 38rem;
        height: 38rem;
        top: 8rem;
        right: -12rem;
        background: radial-gradient(circle at 70% 40%, #db2777, transparent 70%);
        animation: cm-drift-2 40s ease-in-out infinite;
      }
      .cm-aurora__blob--3 {
        width: 34rem;
        height: 34rem;
        bottom: -16rem;
        left: 22rem;
        background: radial-gradient(circle at 50% 50%, #059669, transparent 70%);
        animation: cm-drift-3 46s ease-in-out infinite;
      }
      @keyframes cm-drift-1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(4rem, 3rem) scale(1.08); }
      }
      @keyframes cm-drift-2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-3rem, 4rem) scale(1.05); }
      }
      @keyframes cm-drift-3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(3rem, -3rem) scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cm-aurora__blob { animation: none; }
      }

      @keyframes cm-shake {
        10%, 90% { transform: translateX(-1px); }
        20%, 80% { transform: translateX(2px); }
        30%, 50%, 70% { transform: translateX(-4px); }
        40%, 60% { transform: translateX(4px); }
      }
      .cm-shake { animation: cm-shake 400ms; }

      @keyframes cm-rise-in {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .cm-rise-in {
        animation: cm-rise-in 450ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @media (prefers-reduced-motion: reduce) {
        .cm-rise-in { animation: none; }
      }

      @keyframes cm-spin {
        to { transform: rotate(360deg); }
      }
      .cm-spinner {
        animation: cm-spin 700ms linear infinite;
      }
    </style>
  </head>
  <body class="min-h-screen bg-neutral-950 text-white antialiased">
    <div class="cm-aurora" aria-hidden="true">
      <div class="cm-aurora__blob cm-aurora__blob--1"></div>
      <div class="cm-aurora__blob cm-aurora__blob--2"></div>
      <div class="cm-aurora__blob cm-aurora__blob--3"></div>
    </div>

    <div class="min-h-screen flex flex-col items-center justify-center relative z-10 px-4 gap-5">
      <form
        id="login-form"
        class="cm-glass-modal cm-rise-in rounded-3xl p-8 w-full max-w-sm flex flex-col gap-5"
        autocomplete="on"
        onsubmit="return handleLogin(event)"
      >
        <div class="flex flex-col items-center gap-3 text-center">
          <div
            class="w-12 h-12 rounded-2xl cm-glass flex items-center justify-center text-blue-300/90 shadow-[0_0_0_1px_rgba(96,165,250,0.15),0_10px_30px_-12px_rgba(96,165,250,0.4)]"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight text-white">Cartão Mestre</h1>
            <p class="text-xs text-white/40 mt-0.5">Entre para acessar o dashboard</p>
          </div>
        </div>

        <div id="login-error" class="hidden rounded-xl bg-red-950/60 border border-red-800 text-red-200 text-xs px-3 py-2"></div>

        <label class="flex flex-col gap-1.5">
          <span class="text-xs text-white/50">Usuário</span>
          <span class="cm-input-wrap relative flex items-center">
            <svg class="cm-input-icon absolute left-3" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              class="cm-input rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder:text-white/30 w-full"
              placeholder="usuario"
            />
          </span>
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-xs text-white/50">Senha</span>
          <span class="cm-input-wrap relative flex items-center">
            <svg class="cm-input-icon absolute left-3" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="cm-input rounded-xl pl-9 pr-10 py-2.5 text-sm text-white placeholder:text-white/30 w-full"
              placeholder="••••••••"
            />
            <button
              type="button"
              id="toggle-pw"
              onclick="togglePassword()"
              class="cm-toggle-pw absolute right-2.5 p-1"
              aria-label="Mostrar senha"
              tabindex="-1"
            >
              <svg id="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg id="eye-closed" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg>
            </button>
          </span>
        </label>

        <button
          id="submit-btn"
          type="submit"
          class="mt-1 rounded-xl bg-blue-600 hover:bg-blue-500 transition-colors duration-150 text-sm font-semibold py-2.5 disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        >
          <svg id="submit-spinner" class="hidden cm-spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9" opacity="0.9"></path></svg>
          <span id="submit-label">Entrar</span>
        </button>

        <p class="text-center text-[11px] text-white/30 -mt-1">
          Acesso restrito. Sem cadastro próprio — fale com o administrador
          pra receber suas credenciais.
        </p>
      </form>

      <a
        href="/"
        class="cm-rise-in text-xs text-white/35 hover:text-white/60 transition-colors duration-150 flex items-center gap-1.5 no-underline"
        style="animation-delay: 120ms"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
        Voltar para eltonmarques.com
      </a>
    </div>

    <script>
      const form = document.getElementById("login-form");
      const errorBox = document.getElementById("login-error");
      const submitBtn = document.getElementById("submit-btn");
      const submitLabel = document.getElementById("submit-label");
      const submitSpinner = document.getElementById("submit-spinner");

      function nextUrl() {
        const params = new URLSearchParams(location.search);
        const next = params.get("next");
        return next && next.startsWith("/") ? next : "/cartaomestre/";
      }

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("hidden");
        form.classList.remove("cm-shake");
        void form.offsetWidth; // reinicia a animação se já tiver rodado
        form.classList.add("cm-shake");
      }

      function togglePassword() {
        const input = document.getElementById("password");
        const eyeOpen = document.getElementById("eye-open");
        const eyeClosed = document.getElementById("eye-closed");
        const btn = document.getElementById("toggle-pw");
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        eyeOpen.classList.toggle("hidden", !showing);
        eyeClosed.classList.toggle("hidden", showing);
        btn.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
      }

      // Handler ligado via atributo onsubmit inline no <form> (não por
      // addEventListener) — o próprio parser do HTML garante a chamada,
      // sem depender de nenhuma query de DOM ter rodado antes. ev.preventDefault()
      // roda síncrono, antes de qualquer await, então o navegador nunca chega a
      // fazer o GET nativo com usuário/senha na URL — o que estava acontecendo antes.
      async function handleLogin(ev) {
        ev.preventDefault();
        errorBox.classList.add("hidden");
        submitBtn.disabled = true;
        submitLabel.textContent = "Entrando…";
        submitSpinner.classList.remove("hidden");

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
          const res = await fetch("/auth/login", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          if (res.ok) {
            location.href = nextUrl();
            return false;
          }
          const data = await res.json().catch(() => ({}));
          showError(data.error || "Usuário ou senha inválidos.");
        } catch (err) {
          console.error("Falha no login:", err);
          showError("Não foi possível conectar. Tente novamente.");
        } finally {
          submitBtn.disabled = false;
          submitLabel.textContent = "Entrar";
          submitSpinner.classList.add("hidden");
        }
        return false;
      }
    </script>
  </body>
</html>
