<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Página não encontrada — Elton Marques</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d1b2a" />
    <link rel="icon" href="design-system/assets/logo/logo-em-32.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        background: #0d1b2a;
        color: #ffffff;
        font-family:

          BlinkMacSystemFont,

        color: rgba(255, 255, 255, 0.78);

        margin: 0;
      }

        font-size: 1.25rem;

        color: #ffffff;

        border-radius: 9999px;
